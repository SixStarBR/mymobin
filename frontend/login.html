<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Six Star Mobin</title>
    <!-- Seus links CSS e estilos aqui -->
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; }
        .login-container { background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .login-container img { max-width: 150px; margin-bottom: 20px; }
        .login-container h1 { font-size: 24px; margin-bottom: 10px; color: #333; }
        .login-container p { font-size: 14px; color: #666; margin-bottom: 20px; }
        .login-container form { display: flex; flex-direction: column; }
        .login-container input[type="email"],
        .login-container input[type="password"] { padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        .login-container button { background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background-color 0.3s ease; }
        .login-container button:hover { background-color: #0056b3; }
        .login-container .error-message { color: #e74c3c; margin-top: 10px; display: none; } /* Estilo para a mensagem de erro */
        .footer { margin-top: 30px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="https://sixstartrips.com/site_assets/img/logo.png" alt="Six Star Mobin">
        <h1>Six Star Mobin</h1>
        <p>Sistema de Gestão de Transfers & Mobilidade</p>

        <!-- AQUI ESTÁ A ALTERAÇÃO: ADICIONADO id="loginErro" e style="display: none;" -->
        <p id="loginErro" class="error-message" style="display: none;">⚠️ Login ou senha incorretos. Tente novamente.</p>

        <!-- AQUI ESTÁ A ALTERAÇÃO: ADICIONADO id="loginForm" -->
        <form id="loginForm">
            <input type="email" id="loginInput" placeholder="Login" required>
            <input type="password" id="senhaInput" placeholder="Senha" required>
            <button type="submit">Entrar no Sistema</button>
        </form>

        <p class="footer">© 2025 Six Star Mobin. Todos os direitos reservados.</p>
    </div>

    <script>
        const API_BASE = 'https://mymobin.onrender.com'; // Sua URL base da API

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const loginInput = document.getElementById('loginInput');
            const senhaInput = document.getElementById('senhaInput');
            const erroBox = document.getElementById('loginErro');

            if (!loginForm || !loginInput || !senhaInput || !erroBox) {
                console.error('Elementos HTML de login não encontrados. Verifique os IDs.');
                return;
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Impede o recarregamento da página

                const login = loginInput.value;
                const senha = senhaInput.value;

                erroBox.style.display = 'none'; // Esconde a mensagem de erro anterior

                try {
                    const response = await fetch(`${API_BASE}/api/admin/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ login, senha })
                    });

                    const data = await response.json();
                    console.log('Dados recebidos da API após login:', data);

                    if (response.ok && data && data.token && data.admin) {
                        console.log('Entrou no bloco if (data && data.admin). Objeto data.admin:', data.admin);
                        localStorage.setItem('sixstar_token', data.token);
                        localStorage.setItem('ssm_user', JSON.stringify(data.admin)); // Salva o objeto admin completo
                        console.log('ssm_user salvo no localStorage:', localStorage.getItem('ssm_user'));
                        window.location.href = 'admin.html'; // Redireciona para a página de administração
                    } else {
                        console.error('Erro no login:', data.erro || 'Credenciais inválidas.');
                        erroBox.textContent = data.erro || 'Login ou senha incorretos. Tente novamente.';
                        erroBox.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Erro ao conectar com o servidor:', error);
                    erroBox.textContent = 'Erro ao conectar com o servidor. Tente novamente.';
                    erroBox.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
