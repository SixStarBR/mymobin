<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Six Star Mobin — Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #2c2c2c 50%, #1a1a1a 100%);
    }
    .login-box {
      background: var(--white);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo img {
      height: 70px;
      margin-bottom: 12px;
    }
    .login-logo h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.5px;
    }
    .login-logo p {
      font-size: 13px;
      color: var(--medium);
      margin-top: 4px;
    }
    .login-box .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      padding: 14px;
      font-size: 15px;
      border-radius: 10px;
      margin-top: 8px;
    }
    .login-box .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245,166,35,0.4);
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--medium);
    }
    .input-icon {
      position: relative;
    }
    .input-icon span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
    }
    .input-icon .form-control {
      padding-left: 40px;
    }
    .login-error {
      display: none;
      background: #f8d7da;
      color: #721c24;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      border-left: 4px solid var(--danger);
    }
    .stars-decoration {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 8px;
    }
    .stars-decoration span {
      color: var(--primary);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card" style="max-width: 400px; margin: 60px auto;">
    <div class="text-center mb-3">
      <img src="https://sixstartrips.com/site_assets/img/logo.png" alt="Six Star Mobin" style="width: 64px; height: 64px;">
      <h1>Six Star Mobin</h1>
      <p class="text-muted">Sistema de Gestão de Transfers & Mobilidade</p>
    </div>

    <div id="login-erro" class="alert alert-danger hidden">
      <p id="loginErro" style="color: #e74c3c; margin-top: 10px; display: none;">⚠️ Login ou senha incorretos. Tente novamente.</p>

    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login">Login</label>
        <input type="text" id="loginInput" class="form-control" placeholder="Login" required>
        
      </div>

      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <input type="password" id="senhaInput" class="form-control" placeholder="Senha" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-2">
        Entrar no Sistema
      </button>
    </form>

    <p class="text-center mt-2 text-muted">
      © 2025 Six Star Mobin. Todos os direitos reservados.
    </p>
  </div>


  
  <script>
    const API_BASE = 'https://mymobin.onrender.com'; // Sua URL base da API

    const form = document.querySelector('form'); // Seleciona o formulário
    const inputLogin = document.getElementById('loginInput'); // Seleciona o input de login pelo ID
    const inputSenha = document.getElementById('senhaInput'); // Seleciona o input de senha pelo ID
    const erroBox = document.getElementById('loginErro'); // Seleciona o parágrafo de erro pelo ID

    // Garante que os elementos foram encontrados
    if (!form) console.error("Formulário de login não encontrado.");
    if (!inputLogin) console.error("Input de login não encontrado.");
    if (!inputSenha) console.error("Input de senha não encontrado.");
    if (!erroBox) console.error("Parágrafo de erro não encontrado. Crie um <p> para mensagens de erro.");

    if (erroBox) {
        erroBox.textContent = 'Erro: Dados do administrador não recebidos da API. Tente novamente.';

    }

} catch (err) {
    console.error('Erro na chamada de login:', err);
    if (erroBox) {
      erroBox.textContent = 'Erro ao conectar com o servidor. Tente novamente.';
      erroBox.style.display = 'block';
    }
  }
    });
  </script>
</body>
</html>
